<h1>Ansiedade</h1>

<p>Ansiedade é uma resposta natural do corpo, mas pode se tornar intensa.</p>

<h3>Sinais comuns</h3>
<ul>
<li>Preocupação excessiva</li>
<li>Tensão</li>
<li>Pensamentos acelerados</li>
</ul>

<h3>Exercício</h3>
<p>Respiração 4-7-8: inspire 4s, segure 7s, expire 8s.</p>
